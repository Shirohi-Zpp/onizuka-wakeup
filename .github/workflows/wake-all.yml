name: Wake All
on:
  workflow_dispatch:
jobs:
  wake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Wake everyone
        env:
          U1: ${{ secrets.ONIZUKA_WEBHOOK_URL }}
          K1: ${{ secrets.ONIZUKA_WEBHOOK_KEY }}
          U2: ${{ secrets.NIKKY_WEBHOOK_URL }}
          K2: ${{ secrets.NIKKY_WEBHOOK_KEY }}
        run: |
          RUN="${GITHUB_RUN_ID}"; N=2
          echo "RUN=$RUN" >> $GITHUB_ENV
          body="{\"source\":\"github-actions\",\"run_id\":\"$RUN\",\"expected\":$N}"
          for i in 1 2; do u=U$i; k=K$i
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${!u}" -H "Content-Type: application/json" -H "Authorization: Bearer ${!k}" -d "$body")
            echo "hook$i status=$code"; done
          date +%s > start
      - name: Wait for JSON (max 10 min)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(seq 1 60); do
            msg=$(gh api repos/${{ github.repository }}/commits -q '.[0].commit.message' 2>/dev/null)
            if [ "$msg" = "run $RUN complete" ]; then
              echo "届いた: $(( $(date +%s) - $(cat start) ))秒"
              gh api repos/${{ github.repository }}/contents/data/consciousness.json -H "Accept: application/vnd.github.raw" > consciousness.json
              tail -c 600 consciousness.json; exit 0; fi
            sleep 10; done
          echo "時間切れ"; exit 1
      - uses: actions/checkout@v4
        with: { path: repo }
      - name: Draw house
        run: |
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null; pip install -q pillow
          cd repo/house && mkdir -p layers
          python3 room.py build >/dev/null && python3 gen.py >/dev/null && python3 swap_objects.py >/dev/null
          mkdir -p ../output && cp house-live.png ../output/house-live.png
          cd .. && git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add output/house-live.png
          git diff --cached --quiet || (git commit -qm "house for run $RUN" && git push -q)
          echo "家の画像まで: $(( $(date +%s) - $(cat ../start) ))秒"
      - uses: actions/upload-artifact@v4
        if: success()
        with: { name: consciousness, path: "consciousness.json\nrepo/output/house-live.png" }
